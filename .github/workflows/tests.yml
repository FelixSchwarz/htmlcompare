name: run

on:
  push:
    branches:
    - main
    - ci
  pull_request:
    branches:
    - main
  # This is necessary so that "release.yml" can require a passing test suite
  workflow_call:
    inputs:
      use_locked_dependencies:
        description: "Run tests against the committed uv.lock instead of current PyPI releases."
        required: false
        default: false
        type: boolean


env:
  # query OSV for known malware before syncing
  UV_MALWARE_CHECK: "1"


jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    env:
      # the uv cache and the workspace are on different filesystems in a
      # container job, so uv can not hardlink and would warn about it
      UV_LINK_MODE: copy

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest-known"

    # This job runs inside a container, not directly on the runner: the
    # checkout belongs to the runner user while the steps run as root, so git
    # rejects the repository ("dubious ownership"). "actions/checkout" does not
    # cover this, it sets "safe.directory" only in a temporary git config which
    # applies to its own git commands.
    - name: Allow git to use the checked out repository
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Check that uv.lock is up to date
      run: uv lock --check

    - name: Check that build constraints match uv.lock
      # The generated-file header contains its output path, so compare only the
      # dependency records with a header-less fresh export.
      run: |
        actual_constraints=$(mktemp)
        trap 'rm -f "$actual_constraints"' EXIT
        uv export --frozen --only-group build --no-header > "$actual_constraints"
        tail -n +3 build-constraints.txt | diff --unified - "$actual_constraints"

    - name: Run prek hooks
      run: uv run --locked --python python --group quality prek run --all-files

  tests-cpython:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.9, "3.10", "3.11", "3.12", "3.13", "3.14"]
    container:
      image: python:${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest-known"

    - name: Run test suite with CPython
      run: |
        if [ "${{ inputs.use_locked_dependencies }}" = "true" ]; then
          uv run --locked --python python --extra testing pytest
        else
          # We deliberately disregard locked dependencies here so ordinary CI
          # runs can detect breakage due to new versions published on pypi.
          # We use locked dependencies only for release builds to avoid
          # installing compromised packages when we build our own wheels.
          uv venv --python python venv-test
          . venv-test/bin/activate
          uv pip install -e '.[testing]'
          uv run --active --no-project pytest
        fi


  tests-pypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["3.10", "3.11", "latest"]
    container:
        image: pypy:${{ matrix.pypy-version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest-known"

    - name: Run test suite with pypy
      run: |
        if [ "${{ inputs.use_locked_dependencies }}" = "true" ]; then
          uv run --locked --python python --extra testing pytest
        else
          # We deliberately disregard locked dependencies here so ordinary CI
          # runs can detect breakage due to new versions published on pypi.
          # We use locked dependencies only for release builds to avoid
          # installing compromised packages when we build our own wheels.
          uv venv --python python venv-test
          . venv-test/bin/activate
          uv pip install -e '.[testing]'
          uv run --active --no-project pytest
        fi
