name: Create Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read


env:
  # query OSV for known malware before syncing
  UV_MALWARE_CHECK: "1"


jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      use_locked_dependencies: true

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only for this job so the called test workflow only inherits
    # the (read-only) permissions declared above.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"

      - name: Build wheel
        run: |
          uv venv venv-test
          . venv-test/bin/activate
          uv build --wheel --sdist
          rm dist/.gitignore

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "release-artifacts"
          path: dist/*
          if-no-files-found: error

      - name: Prepare release metadata
        run: |
          echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
