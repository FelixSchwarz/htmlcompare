name: Create Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read


env:
  # query OSV for known malware before syncing
  UV_MALWARE_CHECK: "1"


jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      use_locked_dependencies: true

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only for this job so the called test workflow only inherits
    # the (read-only) permissions declared above.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest-known"

      - name: Build wheel and sdist
        run: |
          uv build --wheel --sdist --build-constraint build-constraints.txt --require-hashes
          rm dist/.gitignore

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "release-artifacts"
          path: dist/*
          if-no-files-found: error

      - name: Prepare release metadata
        run: |
          echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The environment gates the upload (and holds the trusted publisher
    # configured on pypi), so the OIDC token is only issued for this job.
    environment:
      name: pypi
      url: https://pypi.org/p/HTMLCompare
    permissions:
      id-token: write

    steps:
      - name: download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "release-artifacts"
          path: dist

      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
